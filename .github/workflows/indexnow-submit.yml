name: Submit URLs to IndexNow after deploy

# Corre en cada push a main (= cada despliegue de producción a Vercel) y además
# una vez al día.
#
# El disparo diario existe porque el catálogo cambia sin que cambie el código: el
# negocio agrega una categoría o repone un producto agotado en Zentivy, la web lo
# refleja sola —lee la API en cada regeneración— pero IndexNow solo se enteraba al
# subir código. Una categoría nueva podía quedar semanas sin anunciarse a Bing
# esperando un commit que no tenía nada que ver con ella.
on:
  push:
    branches:
      - main
  schedule:
    # 08:00 UTC = 3:00 a.m. en Colombia, fuera del horario de atención.
    - cron: "0 8 * * *"
  # Permite dispararlo a mano desde la pestaña Actions tras un cambio grande de inventario.
  workflow_dispatch:

jobs:
  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest

    steps:
      # Wait for Vercel to finish deploying before submitting URLs.
      # Vercel typically takes 30–90 seconds for a production build.
      # Solo tras un push: la corrida diaria no espera ningún despliegue.
      - name: Wait for Vercel deployment
        if: github.event_name == 'push'
        run: sleep 120

      # Call the IndexNow deploy endpoint to submit all site URLs to Bing.
      - name: Submit all URLs to IndexNow
        run: |
          RESPONSE=$(curl -s -L -o /tmp/indexnow_response.json -w "%{http_code}" \
            -X POST "https://compuservicessoft.com/api/indexnow-deploy" \
            -H "x-api-key: ${{ secrets.INDEXNOW_ROUTE_SECRET }}")

          echo "HTTP status: $RESPONSE"
          echo "Response body:"
          cat /tmp/indexnow_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "IndexNow submission failed with status $RESPONSE"
            exit 1
          fi

          echo "IndexNow submission successful"
